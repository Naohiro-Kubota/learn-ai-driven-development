name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.9.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.5.1'
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI
        run: pnpm run verify:openapi
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Frontend unit tests
        run: pnpm test
      - name: Node script tests
        run: node --test scripts/verify-openapi.test.mjs scripts/test-postgres.test.mjs scripts/verify-ci-workflow.test.mjs scripts/e2e-seed.test.mjs
      - name: E2E runner unit tests
        run: pnpm run test:e2e:runner
      - name: Check Keycloak provisioning shell syntax
        run: bash -n scripts/provision-keycloak.sh scripts/provision-keycloak.test.sh
      - name: Keycloak provisioning tests
        run: bash scripts/provision-keycloak.test.sh
      - name: Build
        run: pnpm run build
      - name: Confirm tracked files were not modified
        run: git diff --exit-code

  go:
    name: Go static and unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.9.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.5.1'
          run_install: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: Check gofmt
        run: pnpm run check:gofmt
      - name: Go vet
        run: go vet ./...
      - name: Go tests without database
        run: go test $(go list ./... | grep -v '/internal/store/postgres$') -count=1
      - name: Verify Go modules
        run: go mod verify
      - name: Confirm tracked files were not modified
        run: git diff --exit-code

  database:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.9.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.5.1'
          run_install: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: PostgreSQL integration tests
        run: pnpm run test:db
      - name: Clean PostgreSQL resources
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans
        env:
          TEST_DB_PASSWORD: cleanup-only
      - name: Confirm tracked files were not modified
        if: always()
        run: git diff --exit-code

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.9.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.5.1'
          run_install: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser integration tests
        run: pnpm run test:e2e
      - name: Confirm tracked files were not modified
        if: always()
        run: git diff --exit-code
