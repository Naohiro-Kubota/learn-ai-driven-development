services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: approval_flow_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_USER: test_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d approval_flow_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
