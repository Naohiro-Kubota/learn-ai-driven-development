services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: approval_flow_e2e
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: "${E2E_DB_PASSWORD:?E2E_DB_PASSWORD is required}"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - e2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e_user -d approval_flow_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: e2e_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${E2E_KEYCLOAK_ADMIN_PASSWORD:?E2E_KEYCLOAK_ADMIN_PASSWORD is required}"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
volumes:
  e2e_postgres:
