# Project-local Codex permissions.
#
# This file is loaded only after this repository is trusted by Codex.
# Network access is deliberately restricted to package registries and GitHub.

# Commands allowed by the workspace sandbox, including the permitted network
# destinations below, run without approval. The custom profile grants the
# minimum additional permission needed to create and update feature branches.
approval_policy = "never"
default_permissions = "project-git-write"

[features]
network_proxy = true

[permissions.project-git-write]
description = "Edit the project and Git metadata while preserving protected paths."
extends = ":workspace"

[permissions.project-git-write.filesystem.":workspace_roots"]
".git" = "write"
".codex" = "read"
".agents" = "read"

[permissions.project-git-write.network]
enabled = true
allow_local_binding = true

[permissions.project-git-write.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"
"api.github.com" = "allow"
"codeload.github.com" = "allow"
"github.com" = "allow"
"objects.githubusercontent.com" = "allow"
"proxy.golang.org" = "allow"
"registry.npmjs.org" = "allow"
"sum.golang.org" = "allow"

[permissions.project-git-write.network.unix_sockets]
"/Users/nao/.rd/docker.sock" = "allow"

# Deny Codex-issued Git/GitHub commands that mutate, switch to, or explicitly
# target the protected main/develop branches. The hook's source is versioned
# with this repository for reviewability.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '/usr/bin/python3 "$(git rev-parse --show-toplevel)/.codex/hooks/protect_branches.py"'
timeout = 5
statusMessage = "保護ブランチへの操作を確認中"
